[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqtermx"
version = "0.1.4"
description = "A Python terminal emulator targeting ECMA-48, VT102, and xterm compatibility"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.5", "wcwidth>=0.2", "pywinpty>=3.0; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.0", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
